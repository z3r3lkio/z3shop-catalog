name: Diagnose GFS catalog source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-gfs-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch and inspect source catalog
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const url = 'https://pfs-library.xetdy-am.workers.dev/api/packages';
          const r = await fetch(url, {headers:{'User-Agent':'Z3Shop-Diagnostics/1.0','Accept':'application/json'}});
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          const data = await r.json();
          const pkgs = Array.isArray(data.packages) ? data.packages : [];
          console.log('packages=', pkgs.length);
          let totalLinks=0;
          const providers = new Map();
          const keysets = new Map();
          const samples=[];
          for (const p of pkgs) {
            const links = Array.isArray(p.downloadLinks) ? p.downloadLinks : [];
            totalLinks += links.length;
            for (const l of links) {
              const name=String(l?.name||'');
              providers.set(name,(providers.get(name)||0)+1);
              const keys=Object.keys(l||{}).sort().join(',');
              keysets.set(keys,(keysets.get(keys)||0)+1);
              if (samples.length<20) samples.push({
                game:p.title,
                id:p.id,
                pack:p.pack,
                link:l,
              });
            }
          }
          console.log('totalLinks=', totalLinks);
          console.log('providers=', JSON.stringify(Object.fromEntries([...providers].sort((a,b)=>b[1]-a[1])), null, 2));
          console.log('linkKeysets=', JSON.stringify(Object.fromEntries([...keysets].sort((a,b)=>b[1]-a[1])), null, 2));
          console.log('samples=', JSON.stringify(samples, null, 2));
          JS
