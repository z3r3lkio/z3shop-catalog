name: Generate Z3Shop packages.json

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/generate-packages.mjs'
      - 'scripts/sync-pfs-library.mjs'
      - 'scripts/generate-games-pages.mjs'
      - 'scripts/sync-game-artwork.py'
      - 'scripts/sync-icons.py'
      - 'scripts/extract-pkg-icons.py'
      - 'scripts/sanitize-icons.py'
      - '.github/workflows/generate-packages.yml'

permissions:
  contents: write

concurrency:
  group: z3shop-catalog-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate merged catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ./scripts/generate-packages.mjs

      - name: Parse GFS PFS Library discovery source
        run: node ./scripts/sync-pfs-library.mjs

      - name: Generate paginated games catalog and source manifests
        run: node ./scripts/generate-games-pages.mjs

      - name: Set up artwork optimizer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .icon-venv
          .icon-venv/bin/python -m pip install --disable-pip-version-check --quiet pillow

      - name: Generate optimized game artwork
        run: .icon-venv/bin/python ./scripts/sync-game-artwork.py

      - name: Resolve and optimize upstream icons
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .icon-venv/bin/python ./scripts/sync-icons.py

      - name: Extract missing ICON0 directly from remote PKGs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .icon-venv/bin/python ./scripts/extract-pkg-icons.py

      - name: Reject generic or unverified artwork
        run: .icon-venv/bin/python ./scripts/sanitize-icons.py

      - name: Validate generated catalog
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("packages.json","utf8"));if(!Array.isArray(c.packages)||!c.packages.length)process.exit(1);const ids=new Set();for(const p of c.packages){if(!p.id||ids.has(p.id)||!p.name||!p.redistributable)process.exit(2);ids.add(p.id);if(p.installable&&!/^https:\/\//i.test(p.url||""))process.exit(3);if(p.icon_url&&!/^https:\/\/raw\.githubusercontent\.com\/z3r3lkio\/z3shop-catalog\/main\/icons\//i.test(p.icon_url))process.exit(4);if(p.icon_bytes&&p.icon_bytes>225280)process.exit(5);if((p.icon_source_url||"").toLowerCase()==="cached")process.exit(6);if(/\/storage\/users\/.*\/avatar\./i.test(p.icon_source_url||""))process.exit(7)};const d=c._discovery?.pfs_library;if(d&&(!(d.packages>0)||!d.pack_counts||d.download_links<0))process.exit(8);console.log(`validated ${c.packages.length} app packages, ${c._stats?.icons||0} trusted optimized icons and ${d?.packages||0} GFS discovery records`)'
          test $(wc -c < packages.json) -lt 64000
          node <<'JS'
          const fs=require('fs');
          const path=require('path');
          const i=JSON.parse(fs.readFileSync('games/index.json','utf8'));
          if(!(i.total>0)||!(i.pages>0)||!(i.page_size>0)||i.version<3)process.exit(20);
          if(i.source?.mode!=='full-source-manifests')process.exit(21);
          if(!Array.isArray(i.pages_index)||i.pages_index.length!==i.pages)process.exit(22);
          let artwork=0,games=0,sources=0,decoded=0,unresolved=0,direct=0,archives=0,providerPages=0;
          const ids=new Set();
          for(const p of i.pages_index){
            const f=`games/page-${String(p.page).padStart(3,'0')}.json`;
            const j=JSON.parse(fs.readFileSync(f,'utf8'));
            if(!Array.isArray(j.games)||j.games.length>i.page_size)process.exit(23);
            if(fs.statSync(f).size>=64000)process.exit(24);
            for(const g of j.games){
              games++;
              if(!g.id||ids.has(g.id)||!g.title||!g.source)process.exit(25);
              ids.add(g.id);
              if(!g.sources_url||!/^https:\/\/raw\.githubusercontent\.com\/z3r3lkio\/z3shop-catalog\/main\/games\/sources\//i.test(g.sources_url))process.exit(26);
              if(!Number.isInteger(g.source_count)||g.source_count<0)process.exit(27);
              if(!g.firmware_label||!g.size_label)process.exit(28);
              const sf=path.join('games','sources',`${g.id}.json`);
              if(!fs.existsSync(sf)||fs.statSync(sf).size>=256000)process.exit(29);
              const sm=JSON.parse(fs.readFileSync(sf,'utf8'));
              if(sm.version!==1||sm.game?.id!==g.id||!Array.isArray(sm.sources)||sm.sources.length!==g.source_count)process.exit(30);
              for(const s of sm.sources){
                sources++;
                if(!s.id||!s.provider||!['direct-file','archive','provider-page','unresolved'].includes(s.mode))process.exit(31);
                if(s.url){decoded++;if(!/^https?:\/\//i.test(s.url))process.exit(32)}else unresolved++;
                if(s.direct)direct++;
                if(s.archive)archives++;
                if(s.mode==='provider-page')providerPages++;
              }
              if(g.icon_url){if(!/^https:\/\/raw\.githubusercontent\.com\/z3r3lkio\/z3shop-catalog\/main\/game-art\//i.test(g.icon_url))process.exit(33);if(!(g.icon_bytes>0&&g.icon_bytes<=225280))process.exit(34);artwork++}
            }
          }
          if(games!==i.total||sources!==i.source_links||decoded!==i.decoded_source_links||unresolved!==i.unresolved_source_links||direct!==i.direct_source_links||archives!==i.archive_source_links||providerPages!==i.provider_page_links)process.exit(35);
          if(artwork!==i.artwork?.ready)process.exit(36);
          console.log(`validated ${games} games, ${sources} source links (${decoded} decoded, ${unresolved} unresolved), ${direct} direct files, ${archives} archives, ${providerPages} provider pages, ${artwork} artworks`);
          JS

      - name: Commit catalog changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- packages.json icons/ games/ game-art/ 2>/dev/null; then
            echo 'packages.json, icons, games catalog/source manifests and game artwork are already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A packages.json icons/ games/ game-art/
          git commit -m 'chore(catalog): refresh packages, icons, games, sources and artwork'
          git push origin HEAD:main
